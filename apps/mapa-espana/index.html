<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de España</title>
<style>
  :root{--bg:#fff8ec;--ink:#2b2a33;--muted:#6b6878;--card:#fff;--line:#f0e2c8;--accent:#ff6b4a;--accent-d:#e0502f;--ok:#1f9d63;--bad:#d6453d;--sea:#d9eefb}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:18px 12px 40px}
  main{width:100%;max-width:520px;text-align:center}
  h1{font-size:1.6rem;margin:4px 0 12px}
  [hidden]{display:none !important}
  .tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
  .tab{font:inherit;font-weight:700;font-size:.98rem;padding:10px 6px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px;margin-bottom:10px}
  .seg button{border:0;background:transparent;font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .stage{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px 10px 14px}
  .top{display:flex;justify-content:space-between;align-items:center;margin:0 6px 6px;font-weight:700;color:var(--muted);font-size:.9rem}
  .prompt{font-size:1.3rem;font-weight:800;margin:2px 4px 8px;min-height:1.8rem}
  .prompt b{color:var(--accent-d)}
  svg.map{width:100%;height:auto;background:var(--sea);border-radius:16px;display:block;touch-action:manipulation}
  .region{fill:var(--c);stroke:#fff;stroke-width:1.3;stroke-linejoin:round;cursor:pointer;transition:fill .12s}
  .region:focus-visible{outline:none;stroke:var(--ink);stroke-width:2.5}
  .map.neutral .region{fill:#f6efdf;stroke:#b9ad92}
  .map.neutral .region.target{fill:var(--accent)}
  .region.target{fill:var(--accent)}
  .region.good{fill:#46c28a !important}
  .region.bad{fill:#ef7b73 !important}
  .region.pulse{animation:pulse .5s 3}
  @keyframes pulse{50%{fill:var(--accent);stroke:var(--ink);stroke-width:3}}
  .hit{fill:var(--c);stroke:#fff;stroke-width:1.5;cursor:pointer}
  .map.neutral .hit{fill:#f6efdf;stroke:#b9ad92}
  .hit.target{fill:var(--accent)} .hit.good{fill:#46c28a !important} .hit.bad{fill:#ef7b73 !important}
  .box{fill:none;stroke:#7aa6c2;stroke-width:1.5}
  .info{margin:10px 4px 0;font-size:1.05rem;min-height:2.6rem}
  .info b{font-size:1.25rem}
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  .opt{font:inherit;font-weight:700;font-size:1.05rem;padding:12px 6px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .opt.wrong{border-color:var(--bad);background:#fff1f0}
  .opt.right{border-color:var(--ok);background:#effaf4}
  .feedback{min-height:2.4rem;font-size:1.02rem;font-weight:700;margin:10px 6px 4px}
  .ok{color:var(--ok)} .bad-t{color:var(--bad)}
  button.main{font:inherit;font-weight:700;font-size:1.1rem;color:#fff;background:var(--accent);border:0;border-radius:14px;padding:12px 20px;cursor:pointer;box-shadow:0 4px 0 var(--accent-d);width:100%;margin-top:8px}
  button.ghost{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.95rem;margin-top:8px}
  .end{text-align:center;padding:8px 4px}
  .end .big{font-size:2.2rem;font-weight:800;margin:6px 0}
  .credit{font-size:.75rem;color:var(--muted);margin-top:14px}
  .back{display:inline-block;margin-top:14px;color:var(--muted);font-size:.9rem}
  @media (prefers-reduced-motion:reduce){.region.pulse{animation:none;fill:var(--accent)}}
</style>
</head>
<body>
<main>
  <h1>🗺️ Mapa de España</h1>

  <div class="tabs" id="tabs" role="group" aria-label="Actividad">
    <button class="tab" data-v="encuentra" aria-pressed="true">👆 Encuéntrala</button>
    <button class="tab" data-v="nombre" aria-pressed="false">🔤 ¿Cómo se llama?</button>
    <button class="tab" data-v="capital" aria-pressed="false">🏛️ Capitales</button>
    <button class="tab" data-v="explora" aria-pressed="false">🔍 Explorar</button>
  </div>
  <div class="seg" id="scope" role="group" aria-label="Territorios">
    <button data-v="17" aria-pressed="true">17 comunidades</button>
    <button data-v="19" aria-pressed="false">+ Ceuta y Melilla</button>
  </div>

  <section class="stage">
    <div class="top"><span id="progress"></span><span id="score"></span></div>
    <div class="prompt" id="prompt"></div>
    <svg class="map" id="map" viewBox="0 0 515 560" role="group" aria-label="Mapa de España"></svg>
    <div class="info" id="info"></div>
    <div class="options" id="options" hidden></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div id="end" class="end" hidden>
      <div class="big" id="endbig"></div>
      <div id="endtxt"></div>
      <button class="main" id="again">Otra ronda ➜</button>
    </div>
    <button class="ghost" id="hint" hidden>Pista</button>
  </section>

  <div class="credit">Mapa: © Instituto Geográfico Nacional de España (CC BY 4.0), datos de <em>es-atlas</em>.</div>
  <a class="back" href="../../">← Todas las aplicaciones</a>
</main>

      mark(Q.cur,'target',true);
      $('prompt').textContent = cfg.mode==='nombre' ? '¿Cómo se llama esta comunidad?' : '¿Cuál es su capital?';
      var ans = cfg.mode==='nombre' ? Q.cur : DATA.caps[Q.cur];
      var all = pool().map(function(id){ return cfg.mode==='nombre' ? id : DATA.caps[id]; }).filter(function(x){ return x!==ans; });
      var opts = shuffle(shuffle(all).slice(0,3).concat([ans]));
      o.innerHTML=''; o.hidden=false;
      opts.forEach(function(t){
        var btn = document.createElement('button'); btn.className='opt'; btn.textContent=t;
        btn.addEventListener('click', function(){
          if (Q.locked) return;
          if (t===ans){ btn.className='opt right'; Q.locked=true; good(); }
          else { btn.className='opt wrong'; btn.disabled=true; wrong('Esa no es. ¡Prueba otra vez! 💪'); }
        });
        o.appendChild(btn);
      });
      $('hint').hidden = true;
    }
  }
  function good(){
    if (!Q.hadErr) Q.first++;
    $('score').textContent = '⭐ '+Q.first;
    mark(Q.cur,'good',true); mark(Q.cur,'target',false);
    var extra = (cfg.mode==='capital') ? '' : (DATA.caps[Q.cur] ? ' Su capital es '+DATA.caps[Q.cur]+'.' : '');
    say('¡Muy bien!'+extra+' 🎉','ok');
    Q.locked = true;
    setTimeout(function(){ if (Q && Q.locked){ Q.i++; showQuestion(); } }, 1100);
  }
  function wrong(msg){ Q.hadErr = true; say(msg,'bad-t'); }
  function finish(){
    clearMarks(); $('options').hidden=true; $('hint').hidden=true; $('prompt').textContent='¡Ronda completada!';
    $('progress').textContent=''; say('','');
    $('end').hidden = false;
    $('endbig').textContent = Q.first+' / '+Q.list.length;
    $('endtxt').textContent = Q.first===Q.list.length ? '¡Todas a la primera! ⭐' : 'acertadas a la primera. ¡Otra ronda y mejoras!';
    $('again').focus({preventScroll:true});
  }

  function onRegion(id){
    if (!active(id)) return;
    if (cfg.mode==='explora'){
      clearMarks(); mark(id,'target',true);
      var info = $('info'); info.textContent='';
      var bb = document.createElement('b'); bb.textContent = id; info.appendChild(bb);
      if (DATA.caps[id]) info.appendChild(document.createTextNode(' · capital: '+DATA.caps[id]));
      else info.appendChild(document.createTextNode(' · ciudad autónoma'));
      return;
    }
    if (cfg.mode!=='encuentra' || !Q || Q.locked || !Q.cur) return;
    if (id === Q.cur){ good(); }
    else {
      mark(id,'bad',true); setTimeout(function(){ mark(id,'bad',false); }, 700);
      wrong('Esa es '+id+'. Sigue buscando 🔎');
    }
  }

  $('hint').addEventListener('click', function(){
    if (!Q || !Q.cur || Q.locked) return;
    Q.hadErr = true;
    mark(Q.cur,'pulse',true); setTimeout(function(){ mark(Q.cur,'pulse',false); }, 1700);
    say('Fíjate en la zona que parpadea 👀','bad-t');
  });
  $('again').addEventListener('click', newRound);

  function group(id, key){
    var g = $(id);
    Array.prototype.forEach.call(g.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){
        cfg[key] = b.getAttribute('data-v');
        Array.prototype.forEach.call(g.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
        newRound();
      });
    });
  }
  group('tabs','mode'); group('scope','scope');
  newRound();
})();
</script>
</body>
</html>
