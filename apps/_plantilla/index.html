<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Título de la app</title>
<style>
  :root{--bg:#fff8ec;--ink:#2b2a33;--muted:#6b6878;--card:#fff;--line:#f0e2c8;--accent:#ff6b4a;--accent-d:#e0502f;--ok:#1f9d63;--bad:#d6453d}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:18px 12px 40px}
  main{width:100%;max-width:480px;text-align:center}
  h1{font-size:1.6rem;margin:4px 0 14px}
  .stage{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px 12px 16px}
  button.main{font:inherit;font-weight:700;font-size:1.15rem;color:#fff;background:var(--accent);border:0;border-radius:14px;padding:13px 22px;cursor:pointer;box-shadow:0 4px 0 var(--accent-d);width:100%}
  .back{display:inline-block;margin-top:18px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>🧩 Título de la app</h1>

  <section class="stage">
    <!-- contenido de la app -->
    <button class="main" id="go">Empezar</button>
  </section>

  <!-- No quitar: enlace para volver a la portada -->
  <a class="back" href="../../">← Todas las aplicaciones</a>
</main>

<script>
(function(){
  // lógica de la app
})();
</script>
</body>
</html>
